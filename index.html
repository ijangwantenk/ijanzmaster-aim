<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IJANMASTER AIM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --easy:   #00ff88;
      --medium: #ffcc00;
      --hard:   #ff3355;
      --bg:     #07070d;
      --bg2:    #0d0d15;
      --panel:  #11111c;
      --border: #1e1e2e;
      --text:   #e0e0f0;
      --dim:    #44445a;
      --font-display: 'Orbitron', monospace;
      --font-mono:    'Share Tech Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    /* ── SCANLINE overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── GRID bg ── */
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ════════════════════ MENU ════════════════════ */
    #screen-menu { gap: 0; }

    .logo-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.6rem;
      margin-bottom: 3.5rem;
      animation: fadeSlideDown 0.7s ease both;
    }

    .crosshair-svg { filter: drop-shadow(0 0 14px #ff3355cc); }

    .logo-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,51,85,0.5);
    }
    .logo-title span { color: var(--hard); }

    .logo-sub {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* difficulty buttons */
    .diff-label {
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 1rem;
      animation: fadeSlideDown 0.8s 0.1s ease both;
    }

    .diff-group {
      display: flex; gap: 1rem;
      flex-wrap: wrap; justify-content: center;
      margin-bottom: 2.5rem;
      animation: fadeSlideDown 0.8s 0.2s ease both;
    }

    .diff-btn {
      position: relative;
      padding: 1.1rem 1.6rem;
      min-width: 130px;
      background: transparent;
      border: 2px solid var(--border);
      color: var(--dim);
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.22s;
      overflow: hidden;
    }
    .diff-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.22s;
    }
    .diff-btn:hover::before { opacity: 0.06; }
    .diff-btn .btn-name { font-size: 1rem; font-weight: 900; display: block; margin-bottom: 3px; }
    .diff-btn .btn-desc { font-size: 0.58rem; opacity: 0.6; font-family: var(--font-mono); }

    .diff-btn.selected-easy   { border-color: var(--easy);   color: var(--easy);   background: rgba(0,255,136,0.07); box-shadow: 0 0 20px rgba(0,255,136,0.2); }
    .diff-btn.selected-medium { border-color: var(--medium); color: var(--medium); background: rgba(255,204,0,0.07);  box-shadow: 0 0 20px rgba(255,204,0,0.2); }
    .diff-btn.selected-hard   { border-color: var(--hard);   color: var(--hard);   background: rgba(255,51,85,0.07);  box-shadow: 0 0 20px rgba(255,51,85,0.2); }

    .start-btn {
      padding: 1rem 3.5rem;
      background: var(--hard);
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
      box-shadow: 0 0 28px rgba(255,51,85,0.4);
      animation: fadeSlideDown 0.8s 0.3s ease both;
    }
    .start-btn:hover { background: #ff5577; box-shadow: 0 0 40px rgba(255,51,85,0.6); transform: translateY(-2px); }
    .start-btn:active { transform: translateY(0); }

    .menu-note {
      margin-top: 1.8rem;
      font-size: 0.55rem;
      color: #2a2a3a;
      letter-spacing: 0.12em;
      animation: fadeSlideDown 0.8s 0.4s ease both;
    }

    /* ════════════════════ GAME ════════════════════ */
    #screen-game {
      padding: 0;
      cursor: crosshair;
      user-select: none;
      align-items: stretch;
      justify-content: stretch;
    }

    #arena {
      position: absolute; inset: 0;
      overflow: hidden;
    }

    /* Flash overlay */
    #flash {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.05s;
    }

    /* HUD top */
    #hud-top {
      position: absolute; top: 0; left: 0; right: 0;
      z-index: 60;
      padding: 0.9rem 1.5rem 0;
      background: linear-gradient(to bottom, rgba(7,7,13,0.95), transparent);
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    #timer-bar-wrap {
      display: flex; align-items: center; gap: 1rem;
    }
    #timer-bar {
      flex: 1; height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    #timer-fill {
      height: 100%;
      width: 100%;
      background: var(--easy);
      border-radius: 2px;
      transition: width 1s linear, background 0.4s;
    }
    #timer-num {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 900;
      min-width: 28px;
      text-align: right;
      color: #fff;
    }

    #hud-stats {
      display: flex; justify-content: center;
      gap: 3rem; padding-bottom: 0.4rem;
    }
    .hud-stat { text-align: center; }
    .hud-stat-label {
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .hud-stat-val {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 900;
    }

    #mode-badge {
      position: absolute; bottom: 1rem; right: 1.5rem;
      z-index: 60;
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      opacity: 0.5;
      text-transform: uppercase;
    }

    /* Dot */
    .dot {
      position: absolute;
      width: 48px; height: 48px;
      border-radius: 50%;
      cursor: crosshair;
      border: 2px solid;
      box-shadow: 0 0 14px, 0 0 30px;
      animation: dotPop 0.12s ease-out both;
      z-index: 20;
      padding: 0;
      outline: none;
    }
    .dot svg {
      position: absolute;
      top: -10px; left: -10px;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      pointer-events: none;
    }
    .dot svg circle {
      fill: none;
      stroke-width: 1.5;
      opacity: 0.35;
      stroke-dasharray: 201;
      stroke-dashoffset: 0;
      transform-origin: 34px 34px;
    }

    /* Ripple */
    .ripple {
      position: absolute;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid;
      pointer-events: none;
      z-index: 30;
      animation: rippleOut 0.5s ease-out forwards;
    }

    /* ════════════════════ RESULT ════════════════════ */
    #screen-result { gap: 0; }

    .result-top {
      text-align: center;
      margin-bottom: 1.8rem;
      animation: fadeSlideDown 0.6s ease both;
    }
    .result-eyebrow {
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .result-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fff;
    }

    .grade-box {
      width: 96px; height: 96px;
      margin: 0 auto 2rem;
      border: 3px solid;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      animation: fadeSlideDown 0.65s 0.05s ease both;
    }
    .grade-label {
      font-family: var(--font-display);
      font-size: 2.8rem;
      font-weight: 900;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
      max-width: 440px;
      animation: fadeSlideDown 0.65s 0.1s ease both;
    }
    .stat-cell {
      background: var(--panel);
      padding: 1.1rem 1rem;
    }
    .stat-cell-label {
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .stat-cell-val {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
    }

    .result-btns {
      display: flex; gap: 1rem; margin-top: 2rem;
      animation: fadeSlideDown 0.65s 0.15s ease both;
    }
    .btn-replay {
      padding: 0.9rem 2.2rem;
      background: var(--hard);
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
      box-shadow: 0 0 22px rgba(255,51,85,0.35);
    }
    .btn-replay:hover { background: #ff5577; transform: translateY(-2px); }
    .btn-menu {
      padding: 0.9rem 2.2rem;
      background: transparent;
      border: 2px solid var(--border);
      color: var(--dim);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .btn-menu:hover { border-color: #44445a; color: var(--text); }

    /* ── ANIMATIONS ── */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPop {
      0%   { transform: scale(0.25); opacity: 0; }
      70%  { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes rippleOut {
      0%   { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes shrinkRing {
      0%   { stroke-dashoffset: 0; opacity: 0.4; }
      85%  { opacity: 0.55; }
      100% { stroke-dashoffset: 201; opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .diff-group { flex-direction: column; align-items: center; }
      .diff-btn { min-width: 200px; }
      #hud-stats { gap: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>

<!-- ══════════ MENU ══════════ -->
<div id="screen-menu" class="screen active">
  <div class="logo-wrap">
    <svg class="crosshair-svg" width="70" height="70" viewBox="0 0 70 70" fill="none">
      <circle cx="35" cy="35" r="22" stroke="#ff3355" stroke-width="2"/>
      <circle cx="35" cy="35" r="4.5" fill="#ff3355"/>
      <line x1="35" y1="4"  x2="35" y2="22" stroke="#ff3355" stroke-width="2"/>
      <line x1="35" y1="48" x2="35" y2="66" stroke="#ff3355" stroke-width="2"/>
      <line x1="4"  y1="35" x2="22" y2="35" stroke="#ff3355" stroke-width="2"/>
      <line x1="48" y1="35" x2="66" y2="35" stroke="#ff3355" stroke-width="2"/>
      <circle cx="35" cy="35" r="30" stroke="#ff3355" stroke-width="0.5" opacity="0.25"/>
    </svg>
    <h1 class="logo-title">IJANMASTER <span>AIM</span></h1>
    <p class="logo-sub">click the dots before they vanish</p>
  </div>

  <p class="diff-label">Select Difficulty</p>
  <div class="diff-group">
    <button class="diff-btn" id="btn-easy"   onclick="selectMode('easy')">
      <span class="btn-name">Easy</span>
      <span class="btn-desc">2.5s window / relaxed</span>
    </button>
    <button class="diff-btn selected-medium" id="btn-medium" onclick="selectMode('medium')">
      <span class="btn-name">Normal</span>
      <span class="btn-desc">1.4s window / balanced</span>
    </button>
    <button class="diff-btn" id="btn-hard"   onclick="selectMode('hard')">
      <span class="btn-name">Hard</span>
      <span class="btn-desc">0.7s window / brutal</span>
    </button>
  </div>

  <button class="start-btn" onclick="startGame()">START — 30s</button>
  <p class="menu-note">misclicking counts as a miss</p>
</div>

<!-- ══════════ GAME ══════════ -->
<div id="screen-game" class="screen">
  <div id="arena" onclick="handleArenaClick(event)">
    <div id="flash"></div>

    <div id="hud-top">
      <div id="timer-bar-wrap">
        <div id="timer-bar"><div id="timer-fill"></div></div>
        <span id="timer-num">30</span>
      </div>
      <div id="hud-stats">
        <div class="hud-stat">
          <div class="hud-stat-label">Score</div>
          <div class="hud-stat-val" id="hud-score" style="color:#fff">0</div>
        </div>
        <div class="hud-stat">
          <div class="hud-stat-label">Hits</div>
          <div class="hud-stat-val" id="hud-hits" style="color:#00ff88">0</div>
        </div>
        <div class="hud-stat">
          <div class="hud-stat-label">Acc</div>
          <div class="hud-stat-val" id="hud-acc" style="color:#00ff88">100%</div>
        </div>
        <div class="hud-stat">
          <div class="hud-stat-label">Miss</div>
          <div class="hud-stat-val" id="hud-miss" style="color:#ff3355">0</div>
        </div>
      </div>
    </div>

    <div id="mode-badge"></div>
  </div>
</div>

<!-- ══════════ RESULT ══════════ -->
<div id="screen-result" class="screen">
  <div class="result-top">
    <p class="result-eyebrow">Session Complete</p>
    <h2 class="result-title">RESULTS</h2>
  </div>
  <div class="grade-box" id="grade-box">
    <span class="grade-label" id="grade-label"></span>
  </div>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="result-btns">
    <button class="btn-replay" onclick="startGame()">PLAY AGAIN</button>
    <button class="btn-menu"   onclick="showScreen('menu')">MENU</button>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const MODES = {
  easy:   { label: 'EASY',   color: '#00ff88', duration: 2500, spawnRate: 1200, desc: '2.5s window' },
  medium: { label: 'NORMAL', color: '#ffcc00', duration: 1400, spawnRate: 900,  desc: '1.4s window' },
  hard:   { label: 'HARD',   color: '#ff3355', duration: 700,  spawnRate: 640,  desc: '0.7s window' },
};
const GAME_DURATION = 30;
const DOT_SIZE = 48;
const PADDING = 70;

// ── STATE ──────────────────────────────────────────────────────────────────
let currentMode   = 'medium';
let score = 0, hits = 0, misses = 0;
let reactions     = [];
let timeLeft      = GAME_DURATION;
let dotIdCounter  = 0;
let dotTimers     = {};
let spawnInterval = null;
let gameInterval  = null;
let gameRunning   = false;

// ── UTILS ──────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function selectMode(m) {
  currentMode = m;
  ['easy','medium','hard'].forEach(k => {
    const btn = document.getElementById('btn-' + k);
    btn.className = 'diff-btn';
    if (k === m) btn.classList.add('selected-' + k);
  });
}

function getGrade(acc) {
  if (acc >= 95) return { label: 'S+', color: '#00ff88' };
  if (acc >= 85) return { label: 'S',  color: '#00ddff' };
  if (acc >= 70) return { label: 'A',  color: '#aaff00' };
  if (acc >= 55) return { label: 'B',  color: '#ffcc00' };
  if (acc >= 40) return { label: 'C',  color: '#ff8800' };
  return { label: 'D', color: '#ff3355' };
}

function clearAll() {
  clearInterval(spawnInterval);
  clearInterval(gameInterval);
  Object.values(dotTimers).forEach(clearTimeout);
  dotTimers = {};
  spawnInterval = null;
  gameInterval  = null;
}

function removeDots() {
  document.querySelectorAll('.dot').forEach(d => d.remove());
  document.querySelectorAll('.ripple').forEach(r => r.remove());
}

// ── FLASH ──────────────────────────────────────────────────────────────────
let flashTimeout = null;
function triggerFlash(type) {
  const el = document.getElementById('flash');
  const cfg = MODES[currentMode];
  el.style.background = type === 'hit'
    ? cfg.color + '22'
    : '#ff335520';
  el.style.opacity = '1';
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(() => { el.style.opacity = '0'; }, 160);
}

// ── HUD ────────────────────────────────────────────────────────────────────
function updateHUD() {
  const cfg = MODES[currentMode];
  const total = hits + misses;
  const acc = total > 0 ? Math.round((hits / total) * 100) : 100;
  const pct = (timeLeft / GAME_DURATION) * 100;

  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-hits').textContent  = hits;
  document.getElementById('hud-miss').textContent  = misses;

  const accEl = document.getElementById('hud-acc');
  accEl.textContent = acc + '%';
  accEl.style.color = acc >= 70 ? '#00ff88' : acc >= 50 ? '#ffcc00' : '#ff3355';

  const fill = document.getElementById('timer-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 40 ? cfg.color : pct > 20 ? '#ffcc00' : '#ff3355';

  const tn = document.getElementById('timer-num');
  tn.textContent = timeLeft;
  tn.style.color = pct <= 20 ? '#ff3355' : '#fff';

  document.getElementById('hud-hits').style.color = cfg.color;
  document.getElementById('mode-badge').textContent = cfg.label + ' — ' + cfg.desc;
  document.getElementById('mode-badge').style.color = cfg.color;
}

// ── SPAWN DOT ─────────────────────────────────────────────────────────────
function spawnDot() {
  if (!gameRunning) return;
  const arena = document.getElementById('arena');
  const w = arena.clientWidth;
  const h = arena.clientHeight;
  const x = PADDING + Math.random() * (w - DOT_SIZE - PADDING * 2);
  const y = PADDING + Math.random() * (h - DOT_SIZE - PADDING * 2);
  const id = ++dotIdCounter;
  const cfg = MODES[currentMode];
  const spawnedAt = Date.now();

  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.id = 'dot-' + id;
  dot.style.cssText = `
    left: ${x}px; top: ${y}px;
    background: radial-gradient(circle at 35% 35%, ${cfg.color}ff, ${cfg.color}88);
    border-color: ${cfg.color};
    box-shadow: 0 0 14px ${cfg.color}99, 0 0 30px ${cfg.color}33;
    color: transparent;
  `;

  // Shrink ring SVG
  dot.innerHTML = `
    <svg viewBox="0 0 68 68">
      <circle cx="34" cy="34" r="32" stroke="${cfg.color}"
        style="animation: shrinkRing ${cfg.duration}ms linear forwards;"/>
    </svg>
  `;

  dot.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!gameRunning) return;
    const reaction = Date.now() - spawnedAt;
    clearTimeout(dotTimers[id]);
    delete dotTimers[id];
    dot.remove();

    hits++;
    score += 100;
    reactions.push(reaction);
    triggerFlash('hit');
    updateHUD();
    spawnRipple(x + DOT_SIZE / 2, y + DOT_SIZE / 2, cfg.color);
  });

  arena.appendChild(dot);

  // Auto-expire
  dotTimers[id] = setTimeout(() => {
    const el = document.getElementById('dot-' + id);
    if (el) el.remove();
    delete dotTimers[id];
    if (!gameRunning) return;
    misses++;
    triggerFlash('miss');
    updateHUD();
  }, cfg.duration);
}

// ── RIPPLE ────────────────────────────────────────────────────────────────
function spawnRipple(cx, cy, color) {
  const arena = document.getElementById('arena');
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.cssText = `
    left: ${cx - 24}px; top: ${cy - 24}px;
    border-color: ${color};
  `;
  arena.appendChild(r);
  setTimeout(() => r.remove(), 520);
}

// ── ARENA CLICK (miss) ────────────────────────────────────────────────────
function handleArenaClick(e) {
  if (!gameRunning) return;
  if (e.target.classList.contains('dot')) return;
  misses++;
  triggerFlash('miss');
  updateHUD();
}

// ── START GAME ────────────────────────────────────────────────────────────
function startGame() {
  clearAll();
  removeDots();
  score = 0; hits = 0; misses = 0;
  reactions = []; timeLeft = GAME_DURATION;
  dotIdCounter = 0;
  gameRunning = true;

  updateHUD();
  showScreen('game');

  const cfg = MODES[currentMode];
  spawnDot();
  spawnInterval = setInterval(spawnDot, cfg.spawnRate);

  gameInterval = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

// ── END GAME ──────────────────────────────────────────────────────────────
function endGame() {
  gameRunning = false;
  clearAll();
  removeDots();

  const total = hits + misses;
  const acc = total > 0 ? Math.round((hits / total) * 100) : 0;
  const avgReact = reactions.length > 0
    ? Math.round(reactions.reduce((a, b) => a + b, 0) / reactions.length)
    : 0;

  const grade = getGrade(acc);
  const cfg = MODES[currentMode];

  // Grade box
  const gb = document.getElementById('grade-box');
  gb.style.borderColor = grade.color;
  gb.style.boxShadow = `0 0 30px ${grade.color}55`;
  document.getElementById('grade-label').textContent = grade.label;
  document.getElementById('grade-label').style.color = grade.color;

  // Stats
  const grid = document.getElementById('stats-grid');
  const cells = [
    { label: 'SCORE',     val: score,                 color: '#fff' },
    { label: 'ACCURACY',  val: acc + '%',              color: '#fff' },
    { label: 'HITS',      val: hits,                  color: '#00ff88' },
    { label: 'MISSES',    val: misses,                 color: '#ff3355' },
    { label: 'AVG REACT', val: avgReact ? avgReact + 'ms' : 'N/A', color: '#fff' },
    { label: 'MODE',      val: cfg.label,              color: cfg.color },
  ];
  grid.innerHTML = cells.map(c => `
    <div class="stat-cell">
      <div class="stat-cell-label">${c.label}</div>
      <div class="stat-cell-val" style="color:${c.color}">${c.val}</div>
    </div>
  `).join('');

  // Re-trigger animations
  document.querySelectorAll('#screen-result .result-top, .grade-box, .stats-grid, .result-btns').forEach(el => {
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = '';
  });

  showScreen('result');
}

// ── INIT ──────────────────────────────────────────────────────────────────
selectMode('medium');
</script>
